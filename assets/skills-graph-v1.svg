<svg width="1280" height="470" viewBox="0 0 1280 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shivam Negi — skill proficiency radar</title>
  <desc id="desc">Six animated neon gauge rings showing proficiency levels across React, JavaScript, TypeScript, Tailwind CSS, Next.js, and Git.</desc>
  <defs>
    <linearGradient id="sgBg" x1="0" y1="0" x2="1280" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".45" stop-color="#071A35"/>
      <stop offset="1" stop-color="#04342F"/>
      <animate attributeName="x1" values="0;140;0" dur="13s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sgSpectrum" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/><stop offset=".3" stop-color="#38BDF8"/><stop offset=".58" stop-color="#A78BFA"/><stop offset=".8" stop-color="#22C55E"/><stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <pattern id="sgGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#7DD3FC" stroke-width=".5" opacity=".08"/>
    </pattern>
    <radialGradient id="ringReact" cx=".5" cy=".5" r=".5"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#0EA5E9"/></radialGradient>
    <radialGradient id="ringJs" cx=".5" cy=".5" r=".5"><stop stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <radialGradient id="ringTs" cx=".5" cy=".5" r=".5"><stop stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6"/></radialGradient>
    <radialGradient id="ringTw" cx=".5" cy=".5" r=".5"><stop stop-color="#A5F3FC"/><stop offset="1" stop-color="#0891B2"/></radialGradient>
    <radialGradient id="ringNext" cx=".5" cy=".5" r=".5"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#94A3B8"/></radialGradient>
    <radialGradient id="ringGit" cx=".5" cy=".5" r=".5"><stop stop-color="#86EFAC"/><stop offset="1" stop-color="#16A34A"/></radialGradient>
    <filter id="ringGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sgClip"><rect width="1280" height="470" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#sgClip)">
    <rect width="1280" height="470" fill="url(#sgBg)"/>
    <rect width="1280" height="470" fill="url(#sgGrid)"/>
    <circle cx="1170" cy="60" r="170" fill="#8B5CF6" opacity=".09"><animate attributeName="r" values="150;190;150" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="420" r="170" fill="#0EA5E9" opacity=".09"><animate attributeName="cy" values="420;380;420" dur="9s" repeatCount="indefinite"/></circle>
    <rect x="0" y="0" width="1280" height="3" fill="url(#sgSpectrum)" opacity=".9">
      <animate attributeName="x" values="-1280;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <g fill="#E0F2FE" opacity=".5">
      <circle cx="700" cy="40" r="1.6"><animate attributeName="cy" values="40;20;40" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="430" r="1.8"><animate attributeName="opacity" values=".1;1;.1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="60" r="1.6"><animate attributeName="cx" values="230;250;230" dur="5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="468" rx="31" stroke="url(#sgSpectrum)" stroke-opacity=".34" stroke-width="2"/>

  <text x="48" y="52" fill="#67E8F9" font-family="Consolas, monospace" font-size="12" font-weight="800" letter-spacing="3">SKILL_MATRIX.EXE // PROFICIENCY SCAN</text>
  <g transform="translate(1108 36)">
    <circle cx="4" cy="4" r="4" fill="#22C55E" filter="url(#ringGlow)"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="18" y="8" fill="#86EFAC" font-family="Consolas, monospace" font-size="10" font-weight="700">LIVE</text>
  </g>
  <text x="48" y="80" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Where I spend most of my build hours</text>

  <!-- gauge card template values: cx=78 cy=76 r=54 circumference=339.29 -->
  <g font-family="Inter, Arial, sans-serif">

    <!-- React 92% -->
    <g transform="translate(48 108)">
      <rect width="380" height="150" rx="20" fill="#0B1526" fill-opacity=".82" stroke="#0EA5E9" stroke-opacity=".55"/>
      <g transform="translate(78 76)">
        <circle r="54" fill="none" stroke="#132038" stroke-width="10"/>
        <circle r="54" fill="none" stroke="url(#ringReact)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" transform="rotate(-90)" filter="url(#ringGlow)">
          <animate attributeName="stroke-dashoffset" values="339.29;27.14" dur="1.8s" begin="0s" fill="freeze" calcMode="spline" keySplines=".2 0 .1 1"/>
          <animate attributeName="opacity" values=".82;1;.82" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
        </circle>
        <text text-anchor="middle" y="6" fill="#F8FAFC" font-family="Consolas, monospace" font-size="19" font-weight="800">92%</text>
      </g>
      <g transform="translate(150 40)">
        <text fill="#38BDF8" font-family="Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.5">CORE_01</text>
        <text y="24" fill="#F8FAFC" font-size="20" font-weight="900">React</text>
        <text y="46" fill="#7DD3FC" font-size="11" font-weight="700">COMPONENT ARCHITECTURE</text>
        <rect y="60" width="190" height="6" rx="3" fill="#0F1C30"/>
        <rect y="60" width="60" height="6" rx="3" fill="#38BDF8" filter="url(#ringGlow)">
          <animate attributeName="width" values="16;190;96;190;16" dur="4.6s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- JavaScript 90% -->
    <g transform="translate(454 108)">
      <rect width="380" height="150" rx="20" fill="#0B1526" fill-opacity=".82" stroke="#F59E0B" stroke-opacity=".5"/>
      <g transform="translate(78 76)">
        <circle r="54" fill="none" stroke="#2A2312" stroke-width="10"/>
        <circle r="54" fill="none" stroke="url(#ringJs)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" transform="rotate(-90)" filter="url(#ringGlow)">
          <animate attributeName="stroke-dashoffset" values="339.29;33.93" dur="1.8s" begin=".15s" fill="freeze" calcMode="spline" keySplines=".2 0 .1 1"/>
          <animate attributeName="opacity" values=".82;1;.82" dur="2.6s" begin="1.95s" repeatCount="indefinite"/>
        </circle>
        <text text-anchor="middle" y="6" fill="#F8FAFC" font-family="Consolas, monospace" font-size="19" font-weight="800">90%</text>
      </g>
      <g transform="translate(150 40)">
        <text fill="#FBBF24" font-family="Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.5">CORE_02</text>
        <text y="24" fill="#F8FAFC" font-size="20" font-weight="900">JavaScript</text>
        <text y="46" fill="#FDE68A" font-size="11" font-weight="700">ES2023 · ASYNC · DOM</text>
        <rect y="60" width="190" height="6" rx="3" fill="#241C0B"/>
        <rect y="60" width="60" height="6" rx="3" fill="#FBBF24" filter="url(#ringGlow)">
          <animate attributeName="width" values="20;190;80;190;20" dur="4.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- TypeScript 85% -->
    <g transform="translate(860 108)">
      <rect width="380" height="150" rx="20" fill="#0B1526" fill-opacity=".82" stroke="#3B82F6" stroke-opacity=".55"/>
      <g transform="translate(78 76)">
        <circle r="54" fill="none" stroke="#111B33" stroke-width="10"/>
        <circle r="54" fill="none" stroke="url(#ringTs)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" transform="rotate(-90)" filter="url(#ringGlow)">
          <animate attributeName="stroke-dashoffset" values="339.29;50.89" dur="1.8s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 0 .1 1"/>
          <animate attributeName="opacity" values=".82;1;.82" dur="2.6s" begin="2.1s" repeatCount="indefinite"/>
        </circle>
        <text text-anchor="middle" y="6" fill="#F8FAFC" font-family="Consolas, monospace" font-size="19" font-weight="800">85%</text>
      </g>
      <g transform="translate(150 40)">
        <text fill="#60A5FA" font-family="Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.5">CORE_03</text>
        <text y="24" fill="#F8FAFC" font-size="20" font-weight="900">TypeScript</text>
        <text y="46" fill="#BFDBFE" font-size="11" font-weight="700">TYPE SAFETY · GENERICS</text>
        <rect y="60" width="190" height="6" rx="3" fill="#0E1930"/>
        <rect y="60" width="60" height="6" rx="3" fill="#60A5FA" filter="url(#ringGlow)">
          <animate attributeName="width" values="18;190;100;190;18" dur="4.9s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Tailwind CSS 88% -->
    <g transform="translate(48 282)">
      <rect width="380" height="150" rx="20" fill="#0B1526" fill-opacity=".82" stroke="#0891B2" stroke-opacity=".55"/>
      <g transform="translate(78 76)">
        <circle r="54" fill="none" stroke="#0F262B" stroke-width="10"/>
        <circle r="54" fill="none" stroke="url(#ringTw)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" transform="rotate(-90)" filter="url(#ringGlow)">
          <animate attributeName="stroke-dashoffset" values="339.29;40.72" dur="1.8s" begin=".45s" fill="freeze" calcMode="spline" keySplines=".2 0 .1 1"/>
          <animate attributeName="opacity" values=".82;1;.82" dur="2.6s" begin="2.25s" repeatCount="indefinite"/>
        </circle>
        <text text-anchor="middle" y="6" fill="#F8FAFC" font-family="Consolas, monospace" font-size="19" font-weight="800">88%</text>
      </g>
      <g transform="translate(150 40)">
        <text fill="#22D3EE" font-family="Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.5">CORE_04</text>
        <text y="24" fill="#F8FAFC" font-size="20" font-weight="900">Tailwind CSS</text>
        <text y="46" fill="#A5F3FC" font-size="11" font-weight="700">DESIGN SYSTEMS · UTILITY</text>
        <rect y="60" width="190" height="6" rx="3" fill="#0B2226"/>
        <rect y="60" width="60" height="6" rx="3" fill="#22D3EE" filter="url(#ringGlow)">
          <animate attributeName="width" values="14;190;90;190;14" dur="4.3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Next.js 80% -->
    <g transform="translate(454 282)">
      <rect width="380" height="150" rx="20" fill="#0B1526" fill-opacity=".82" stroke="#94A3B8" stroke-opacity=".5"/>
      <g transform="translate(78 76)">
        <circle r="54" fill="none" stroke="#1B2432" stroke-width="10"/>
        <circle r="54" fill="none" stroke="url(#ringNext)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" transform="rotate(-90)" filter="url(#ringGlow)">
          <animate attributeName="stroke-dashoffset" values="339.29;67.86" dur="1.8s" begin=".6s" fill="freeze" calcMode="spline" keySplines=".2 0 .1 1"/>
          <animate attributeName="opacity" values=".82;1;.82" dur="2.6s" begin="2.4s" repeatCount="indefinite"/>
        </circle>
        <text text-anchor="middle" y="6" fill="#F8FAFC" font-family="Consolas, monospace" font-size="19" font-weight="800">80%</text>
      </g>
      <g transform="translate(150 40)">
        <text fill="#CBD5E1" font-family="Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.5">CORE_05</text>
        <text y="24" fill="#F8FAFC" font-size="20" font-weight="900">Next.js</text>
        <text y="46" fill="#E2E8F0" font-size="11" font-weight="700">SSR · ROUTING · EDGE</text>
        <rect y="60" width="190" height="6" rx="3" fill="#1A2333"/>
        <rect y="60" width="60" height="6" rx="3" fill="#CBD5E1" filter="url(#ringGlow)">
          <animate attributeName="width" values="22;190;70;190;22" dur="4.7s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Git & GitHub 90% -->
    <g transform="translate(860 282)">
      <rect width="380" height="150" rx="20" fill="#0B1526" fill-opacity=".82" stroke="#16A34A" stroke-opacity=".55"/>
      <g transform="translate(78 76)">
        <circle r="54" fill="none" stroke="#0F2418" stroke-width="10"/>
        <circle r="54" fill="none" stroke="url(#ringGit)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" transform="rotate(-90)" filter="url(#ringGlow)">
          <animate attributeName="stroke-dashoffset" values="339.29;33.93" dur="1.8s" begin=".75s" fill="freeze" calcMode="spline" keySplines=".2 0 .1 1"/>
          <animate attributeName="opacity" values=".82;1;.82" dur="2.6s" begin="2.55s" repeatCount="indefinite"/>
        </circle>
        <text text-anchor="middle" y="6" fill="#F8FAFC" font-family="Consolas, monospace" font-size="19" font-weight="800">90%</text>
      </g>
      <g transform="translate(150 40)">
        <text fill="#4ADE80" font-family="Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.5">CORE_06</text>
        <text y="24" fill="#F8FAFC" font-size="20" font-weight="900">Git &amp; GitHub</text>
        <text y="46" fill="#BBF7D0" font-size="11" font-weight="700">VERSIONING · CI/CD</text>
        <rect y="60" width="190" height="6" rx="3" fill="#0D1F14"/>
        <rect y="60" width="60" height="6" rx="3" fill="#4ADE80" filter="url(#ringGlow)">
          <animate attributeName="width" values="18;190;88;190;18" dur="4.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <path d="M42 452H1238" stroke="#1E293B" stroke-width="2"/>
  <path d="M42 452H1238" stroke="url(#sgSpectrum)" stroke-width="3" stroke-dasharray="10 24" filter="url(#softGlow)" opacity=".8">
    <animate attributeName="stroke-dashoffset" values="0;-136" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
