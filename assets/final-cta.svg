<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Final call to action — let's build the next wow</title>
  <desc id="desc">A glowing closing portal panel with the message "let's build the next wow" and a holographic mascot silhouette.</desc>
  <defs>
    <linearGradient id="fcBg" x1="0" y1="0" x2="1280" y2="360"><stop stop-color="#020617"/><stop offset=".4" stop-color="#0E0A28"/><stop offset=".75" stop-color="#1B0B2E"/><stop offset="1" stop-color="#06070F"/></linearGradient>
    <linearGradient id="fcSpec" x1="30" y1="0" x2="1250" y2="0"><stop stop-color="#22D3EE"/><stop offset=".3" stop-color="#38BDF8"/><stop offset=".55" stop-color="#A78BFA"/><stop offset=".8" stop-color="#E879F9"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <radialGradient id="fcCore"><stop stop-color="#fff"/><stop offset=".15" stop-color="#67E8F9"/><stop offset=".4" stop-color="#A855F7" stop-opacity=".7"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <pattern id="fcGrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#A78BFA" stroke-width=".55" opacity=".08"/></pattern>
    <filter id="fcGlow" x="-100%" y="-120%" width="300%" height="340%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fcDeep" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="24" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="360" rx="34" fill="url(#fcBg)"/><rect width="1280" height="360" rx="34" fill="url(#fcGrid)"/><rect x="1" y="1" width="1278" height="358" rx="33" stroke="url(#fcSpec)" stroke-opacity=".38"/>
  <circle cx="1150" cy="30" r="170" fill="#E879F9" opacity=".06"><animate attributeName="r" values="140;190;140" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="110" cy="340" r="150" fill="#22D3EE" opacity=".06"><animate attributeName="cy" values="340;300;340" dur="8s" repeatCount="indefinite"/></circle>

  <g transform="translate(180 190)">
    <circle r="118" fill="url(#fcCore)" opacity=".2"><animate attributeName="r" values="100;132;100" dur="5.4s" repeatCount="indefinite"/></circle>
    <ellipse rx="128" ry="60" stroke="#38BDF8" stroke-width="2.4" stroke-dasharray="11 16" opacity=".65" filter="url(#fcGlow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></ellipse>
    <circle r="66" fill="url(#fcCore)" opacity=".7" filter="url(#fcDeep)"/>
    <g>
      <path d="M-58-36Q0-66 58-36V22Q0 52-58 22Z" fill="#0B1226" stroke="url(#fcSpec)" stroke-width="2.6"/>
      <rect x="-38" y="-18" width="76" height="30" rx="14" fill="#020617" stroke="#22D3EE" stroke-width="1.6"/>
      <rect x="-33" y="-9" width="66" height="11" rx="5.5" fill="#22D3EE" filter="url(#fcGlow)"><animate attributeName="height" values="11;2;11" dur="4.2s" repeatCount="indefinite" keyTimes="0;.5;1"/><animate attributeName="y" values="-9;-4;-9" dur="4.2s" repeatCount="indefinite" keyTimes="0;.5;1"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5.6s" repeatCount="indefinite"/>
    </g>
    <text x="0" y="98" text-anchor="middle" fill="#64748B" font-family="Consolas, monospace" font-size="10.5">PORTAL STABLE // 100%</text>
  </g>

  <g transform="translate(400 96)">
    <text y="18" fill="#67E8F9" font-family="Consolas, monospace" font-size="13" font-weight="800" letter-spacing="3">TRANSMISSION OPEN</text>
    <text y="76" fill="#F8FAFC" font-family="Inter, Arial" font-size="46" font-weight="900" letter-spacing="-1">LET'S BUILD THE</text>
    <text y="132" fill="#FFFFFF" font-family="Inter, Arial" font-size="56" font-weight="900" letter-spacing="-2">NEXT <tspan fill="#F472B6">WOW.</tspan></text>
    <rect y="150" width="440" height="5" rx="2.5" fill="#1E1B3A"/><rect y="150" width="70" height="5" rx="2.5" fill="url(#fcSpec)" filter="url(#fcGlow)"><animate attributeName="width" values="36;440;190;440;36" dur="5.4s" repeatCount="indefinite"/></rect>
    <text y="188" fill="#CBD5E1" font-family="Inter, Arial" font-size="16">Bold ideas. Clean systems. Unforgettable motion.</text>
  </g>

  <g transform="translate(400 300)" font-family="Consolas, monospace" font-size="11" fill="#64748B">
    <circle cx="4" cy="-4" r="4" fill="#34D399" filter="url(#fcGlow)"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="16">OPEN CHANNELS BELOW · GITHUB · LINKEDIN · EMAIL · PORTFOLIO</text>
  </g>
</svg>
