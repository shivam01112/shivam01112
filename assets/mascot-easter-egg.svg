<svg width="220" height="180" viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tiny cyberpunk mascot easter egg</title>
  <desc id="desc">A small blinking, floating companion bot that occasionally emits a tiny hologram.</desc>
  <defs>
    <linearGradient id="meSpec" x1="0" y1="0" x2="220" y2="0"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <filter id="meGlow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g transform="translate(110 100)">
    <animateTransform attributeName="transform" type="translate" values="110 100;110 88;110 100" dur="5.4s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="58" rx="34" ry="7" fill="#000" opacity=".28"/>
    <path d="M-34-22Q0-42 34-22V12Q0 32-34 12Z" fill="#0B1226" stroke="url(#meSpec)" stroke-width="2"/>
    <rect x="-22" y="-11" width="44" height="18" rx="9" fill="#020617" stroke="#22D3EE" stroke-width="1.3"/>
    <g>
      <rect x="-18" y="-5" width="12" height="7" rx="3.5" fill="#67E8F9" filter="url(#meGlow)">
        <animate attributeName="height" values="7;7;1;7;7" dur="4s" repeatCount="indefinite" keyTimes="0;.82;.86;.9;1"/>
      </rect>
      <rect x="6" y="-5" width="12" height="7" rx="3.5" fill="#F472B6" filter="url(#meGlow)">
        <animate attributeName="height" values="7;7;1;7;7" dur="4s" repeatCount="indefinite" keyTimes="0;.82;.86;.9;1"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0;-5 0;0 0" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <path d="M0-22V-34" stroke="#94A3B8" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="0" cy="-37" r="4" fill="#F472B6" filter="url(#meGlow)"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>

    <!-- tiny hologram blip -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;.55;.62;.75;1" dur="7s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="-52" rx="18" ry="6" fill="none" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="0" y="-56" text-anchor="middle" fill="#DDD6FE" font-family="Consolas, monospace" font-size="8" font-weight="700">HELLO_</text>
    </g>
  </g>
</svg>
