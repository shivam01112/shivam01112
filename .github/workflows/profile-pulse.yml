name: Daily Profile Pulse

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-pulse.yml
      - scripts/generate_pulse_table.py
  schedule:
    # Two windows per day so a missed/delayed run (GitHub scheduled Actions
    # are best-effort and can silently skip during high load) self-heals
    # later the same day. The job is idempotent: if the day's pulses were
    # already logged, the backup window is a no-op.
    - cron: "43 3 * * *" # ~09:13 IST — primary window
    - cron: "35 11 * * *" # ~17:05 IST — backup/catch-up window
  workflow_dispatch:
    inputs:
      commit_count:
        description: "Pulse commits to create"
        required: false
        type: choice
        default: "random"
        options:
          - "random"
          - "2"
          - "3"
          - "4"

permissions:
  contents: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Create profile pulse commits
        shell: bash
        env:
          REQUESTED_COUNT: ${{ inputs.commit_count }}
        run: |
          today=$(date -u "+%Y-%m-%d")
          already_today=$(grep -c "^- $today " activity/profile-pulse.md || true)

          # Idempotency guard: this workflow runs twice a day (a primary
          # window plus a backup window) so a delayed/skipped run self-heals.
          # If today's pulses are already logged, the second window is a
          # deliberate no-op instead of doubling up commits.
          if [[ "$already_today" -ge 2 ]]; then
            echo "Already logged $already_today pulse(s) for $today — skipping."
            exit 0
          fi

          count="$REQUESTED_COUNT"
          if [[ ! "$count" =~ ^[2-4]$ ]]; then
            count=$((RANDOM % 3 + 2))
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for index in $(seq 1 "$count"); do
            timestamp=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
            printf -- "- %s - automated profile pulse %s/%s\n" "$timestamp" "$index" "$count" >> activity/profile-pulse.md
            git add activity/profile-pulse.md
            git commit \
              --author="Shivam Singh Negi <220692565+shivam01112@users.noreply.github.com>" \
              -m "chore(bot): profile pulse $index/$count"
          done

          python scripts/generate_pulse_table.py
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit \
              --author="Shivam Singh Negi <220692565+shivam01112@users.noreply.github.com>" \
              -m "chore(bot): refresh pulse table"
          fi

          git push origin HEAD:main
