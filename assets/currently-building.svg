<svg width="1280" height="230" viewBox="0 0 1280 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Currently building panel</title>
  <desc id="desc">A live build status console showing the current project, stack, and progress.</desc>
  <defs>
    <linearGradient id="cbBg" x1="0" y1="0" x2="1280" y2="230"><stop stop-color="#020617"/><stop offset=".5" stop-color="#150C2E"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="cbSpec" x1="40" y1="0" x2="1240" y2="0"><stop stop-color="#22D3EE"/><stop offset=".45" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <pattern id="cbGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#7DD3FC" stroke-width=".5" opacity=".07"/></pattern>
    <filter id="cbGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="230" rx="28" fill="url(#cbBg)"/><rect width="1280" height="230" rx="28" fill="url(#cbGrid)"/>
  <rect x="1" y="1" width="1278" height="228" rx="27" stroke="url(#cbSpec)" stroke-opacity=".35" stroke-width="1.6"/>

  <g transform="translate(44 34)">
    <circle cx="6" cy="6" r="6" fill="#FBBF24" filter="url(#cbGlow)"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="20" y="11" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="800" letter-spacing="2">CURRENTLY BUILDING</text>
    <text x="990" y="11" fill="#64748B" font-family="Consolas, monospace" font-size="12">LAST UPDATED · TODAY</text>
  </g>

  <g transform="translate(44 66)">
    <text y="30" fill="#F8FAFC" font-family="Inter, Arial" font-size="27" font-weight="900">Interactive Portfolio OS</text>
    <text y="58" fill="#C7D2E3" font-family="Inter, Arial" font-size="14.5">A WebGL-driven personal site — scroll-linked scenes, shader lighting, motion-first UI.</text>

    <g font-family="Inter, Arial" font-size="10.5" font-weight="800" transform="translate(0 74)">
      <g><rect width="64" height="22" rx="11" fill="#082F49" stroke="#22D3EE" stroke-opacity=".7"/><text x="32" y="15" text-anchor="middle" fill="#BAE6FD">REACT</text></g>
      <g transform="translate(72 0)"><rect width="88" height="22" rx="11" fill="#1E1B4B" stroke="#A78BFA" stroke-opacity=".7"/><text x="44" y="15" text-anchor="middle" fill="#DDD6FE">THREE.JS</text></g>
      <g transform="translate(168 0)"><rect width="76" height="22" rx="11" fill="#3B0764" stroke="#E879F9" stroke-opacity=".7"/><text x="38" y="15" text-anchor="middle" fill="#F5D0FE">WEBGL</text></g>
      <g transform="translate(252 0)"><rect width="64" height="22" rx="11" fill="#500724" stroke="#F472B6" stroke-opacity=".7"/><text x="32" y="15" text-anchor="middle" fill="#FBCFE8">GSAP</text></g>
    </g>
  </g>

  <g transform="translate(760 68)">
    <text y="0" fill="#64748B" font-family="Consolas, monospace" font-size="11">BUILD PROGRESS</text>
    <rect y="14" width="476" height="14" rx="7" fill="#161225"/>
    <rect y="14" width="330" height="14" rx="7" fill="url(#cbSpec)" filter="url(#cbGlow)">
      <animate attributeName="width" values="300;332;300" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="476" y="26" text-anchor="end" fill="#F0ABFC" font-family="Consolas, monospace" font-size="12" font-weight="800">69%</text>
    <text y="56" fill="#94A3B8" font-family="Consolas, monospace" font-size="11.5">SCENES 5/7 · SHADERS 3/4 · A11Y PASS</text>
    <g transform="translate(0 74)"><rect width="10" height="10" rx="3" fill="#34D399"><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/></rect><text x="18" y="9" fill="#86EFAC" font-family="Consolas, monospace" font-size="11">DEV SERVER RUNNING</text></g>
  </g>

  <path d="M40 196H1240" stroke="#1E1B3A" stroke-width="2"/>
  <path d="M40 196H1240" stroke="url(#cbSpec)" stroke-width="3" stroke-dasharray="10 22" filter="url(#cbGlow)" opacity=".8"><animate attributeName="stroke-dashoffset" values="0;-128" dur="3s" repeatCount="indefinite"/></path>
</svg>
