<svg width="1280" height="200" viewBox="0 0 1280 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Live activity timeline</title>
  <desc id="desc">A continuous activity timeline with four live states — building, committing, experimenting, shipping — connected by a traveling glow, reflecting the automated profile-pulse workflow.</desc>
  <defs>
    <linearGradient id="laBg" x1="0" y1="0" x2="1280" y2="200"><stop stop-color="#020617"/><stop offset=".5" stop-color="#0E0A26"/><stop offset="1" stop-color="#1B0B2E"/></linearGradient>
    <linearGradient id="laSpec" x1="60" y1="0" x2="1220" y2="0"><stop stop-color="#22D3EE"/><stop offset=".35" stop-color="#A78BFA"/><stop offset=".7" stop-color="#E879F9"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <pattern id="laDots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#D8B4FE" opacity=".14"/></pattern>
    <filter id="laGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1280" height="200" rx="28" fill="url(#laBg)"/><rect width="1280" height="200" rx="28" fill="url(#laDots)"/>
  <rect x="1" y="1" width="1278" height="198" rx="27" stroke="url(#laSpec)" stroke-opacity=".3" stroke-width="1.6"/>

  <g transform="translate(44 36)">
    <circle cx="6" cy="6" r="6" fill="#F472B6" filter="url(#laGlow)"><animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/></circle>
    <text x="20" y="11" fill="#FBCFE8" font-family="Consolas, monospace" font-size="13" font-weight="800" letter-spacing="2">LIVE ACTIVITY</text>
    <text x="990" y="11" fill="#64748B" font-family="Consolas, monospace" font-size="12">STREAMING</text>
  </g>

  <g transform="translate(44 62)">
    <text y="24" fill="#F8FAFC" font-family="Inter, Arial" font-size="21" font-weight="900">The build never really stops.</text>
  </g>

  <!-- timeline -->
  <g transform="translate(96 148)">
    <path d="M0 0H1088" stroke="#1E1B3A" stroke-width="3"/>
    <path d="M0 0H1088" stroke="url(#laSpec)" stroke-width="3" stroke-dasharray="20 1180" filter="url(#laGlow)">
      <animate attributeName="stroke-dashoffset" values="20;-1088" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="6" fill="#fff" filter="url(#laGlow)"><animateMotion dur="6s" repeatCount="indefinite" path="M0 0H1088"/></circle>

    <!-- BUILDING -->
    <g transform="translate(0 0)">
      <circle r="9" fill="#082F49" stroke="#22D3EE" stroke-width="2"/>
      <circle r="9" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity=".6"><animate attributeName="r" values="9;18;9" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3.2s" repeatCount="indefinite"/></circle>
      <text y="-24" text-anchor="middle" fill="#67E8F9" font-family="Consolas, monospace" font-size="12" font-weight="800">BUILDING</text>
      <text y="30" text-anchor="middle" fill="#7DD3FC" font-family="Inter, Arial" font-size="10.5">writing code</text>
    </g>

    <!-- COMMITTING -->
    <g transform="translate(362 0)">
      <circle r="9" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2"/>
      <circle r="9" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity=".6"><animate attributeName="r" values="9;18;9" dur="3.6s" begin="-.9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3.6s" begin="-.9s" repeatCount="indefinite"/></circle>
      <text y="-24" text-anchor="middle" fill="#C4B5FD" font-family="Consolas, monospace" font-size="12" font-weight="800">COMMITTING</text>
      <text y="30" text-anchor="middle" fill="#DDD6FE" font-family="Inter, Arial" font-size="10.5">pushing changes</text>
    </g>

    <!-- EXPERIMENTING -->
    <g transform="translate(724 0)">
      <circle r="9" fill="#3B0764" stroke="#E879F9" stroke-width="2"/>
      <circle r="9" fill="none" stroke="#E879F9" stroke-width="1.5" opacity=".6"><animate attributeName="r" values="9;18;9" dur="3.4s" begin="-1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3.4s" begin="-1.8s" repeatCount="indefinite"/></circle>
      <text y="-24" text-anchor="middle" fill="#F5D0FE" font-family="Consolas, monospace" font-size="12" font-weight="800">EXPERIMENTING</text>
      <text y="30" text-anchor="middle" fill="#F0ABFC" font-family="Inter, Arial" font-size="10.5">prototyping ideas</text>
    </g>

    <!-- SHIPPING -->
    <g transform="translate(1088 0)">
      <circle r="9" fill="#500724" stroke="#F472B6" stroke-width="2"/>
      <circle r="9" fill="none" stroke="#F472B6" stroke-width="1.5" opacity=".6"><animate attributeName="r" values="9;18;9" dur="3.8s" begin="-2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3.8s" begin="-2.7s" repeatCount="indefinite"/></circle>
      <text y="-24" text-anchor="middle" fill="#FBCFE8" font-family="Consolas, monospace" font-size="12" font-weight="800">SHIPPING</text>
      <text y="30" text-anchor="middle" fill="#FCE7F3" font-family="Inter, Arial" font-size="10.5">going live</text>
    </g>
  </g>

  <text x="640" y="192" text-anchor="middle" fill="#4B5563" font-family="Consolas, monospace" font-size="10">AUTOMATED PULSE · 2–4 COMMITS DAILY · REFRESHED VIA GITHUB ACTIONS</text>
</svg>
