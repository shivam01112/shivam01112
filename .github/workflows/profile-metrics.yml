name: Refresh Profile Metrics

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-metrics.yml
      - scripts/update_recent_activity.py
  schedule:
    # Refresh real activity four times a day (UTC). A commit is made only when
    # the generated profile data has actually changed.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Update recent public work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_recent_activity.py

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=prs_merged,reviews&rank_icon=github&custom_title=Shivam%27s%20GitHub%20Signal&bg_color=135,020617,071A35,15102F&title_color=67E8F9&text_color=CBD5E1&icon_color=A78BFA&border_color=164E63&border_radius=18
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&custom_title=Code%20Spectrum&bg_color=135,020617,071A35,15102F&title_color=67E8F9&text_color=CBD5E1&border_color=164E63&border_radius=18
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution streak card
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output assets/github-streak.svg \
            "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&background=135,020617,071A35,15102F&border=164E63&stroke=164E63&ring=67E8F9&fire=FBBF24&currStreakNum=F8FAFC&sideNums=F8FAFC&currStreakLabel=67E8F9&sideLabels=A78BFA&dates=94A3B8&border_radius=18&timezone=Asia/Kolkata"

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-snake.svg
            assets/github-contribution-snake-dark.svg?palette=github-dark

      - name: Commit refreshed metrics
        shell: bash
        run: |
          if git diff --quiet -- README.md assets; then
            echo "Profile activity and metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg assets/top-languages.svg assets/github-streak.svg assets/github-contribution-snake.svg assets/github-contribution-snake-dark.svg
          git commit -m "chore: refresh profile activity"
          git push
