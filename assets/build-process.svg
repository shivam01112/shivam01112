<svg width="1280" height="330" viewBox="0 0 1280 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How I build — seven stage process flow</title>
  <desc id="desc">An animated seven-stage pipeline from idea to deploy, connected by a flowing energy line.</desc>
  <defs>
    <linearGradient id="bpBg" x1="0" y1="0" x2="1280" y2="330"><stop stop-color="#020617"/><stop offset=".55" stop-color="#100A28"/><stop offset="1" stop-color="#1B0B2E"/></linearGradient>
    <linearGradient id="bpFlow" x1="60" y1="0" x2="1220" y2="0"><stop stop-color="#22D3EE"/><stop offset=".2" stop-color="#38BDF8"/><stop offset=".45" stop-color="#A78BFA"/><stop offset=".72" stop-color="#E879F9"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <pattern id="bpGrid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#A78BFA" stroke-width=".5" opacity=".07"/></pattern>
    <filter id="bpGlow" x="-80%" y="-100%" width="260%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bpShadow" x="-30%" y="-40%" width="170%" height="210%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#00030C" flood-opacity=".72"/></filter>
  </defs>
  <rect width="1280" height="330" rx="30" fill="url(#bpBg)"/><rect width="1280" height="330" rx="30" fill="url(#bpGrid)"/><rect x="1" y="1" width="1278" height="328" rx="29" stroke="url(#bpFlow)" stroke-opacity=".26"/>
  <g transform="translate(56 38)"><text y="20" fill="#67E8F9" font-family="Consolas, monospace" font-size="14" font-weight="800" letter-spacing="2">HOW I BUILD // SEVEN STAGE PIPELINE</text><text y="52" fill="#F8FAFC" font-family="Inter, Arial" font-size="26" font-weight="900">Idea to deploy, without losing the spark</text></g>

  <path d="M70 236C170 202 240 264 344 236C444 208 508 264 610 240C710 216 780 264 878 240C976 216 1048 258 1140 232C1180 220 1200 214 1214 208" stroke="#171334" stroke-width="18" stroke-linecap="round"/>
  <path d="M70 236C170 202 240 264 344 236C444 208 508 264 610 240C710 216 780 264 878 240C976 216 1048 258 1140 232C1180 220 1200 214 1214 208" stroke="url(#bpFlow)" stroke-width="5" stroke-linecap="round" stroke-dasharray="16 20" filter="url(#bpGlow)"><animate attributeName="stroke-dashoffset" values="0;-216" dur="3.6s" repeatCount="indefinite"/></path>
  <circle r="8" fill="#fff" filter="url(#bpGlow)"><animateMotion dur="7s" repeatCount="indefinite" path="M70 236C170 202 240 264 344 236C444 208 508 264 610 240C710 216 780 264 878 240C976 216 1048 258 1140 232C1180 220 1200 214 1214 208"/></circle>
  <circle r="5" fill="#F472B6" filter="url(#bpGlow)"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M70 236C170 202 240 264 344 236C444 208 508 264 610 240C710 216 780 264 878 240C976 216 1048 258 1140 232C1180 220 1200 214 1214 208"/></circle>

  <g transform="translate(50 110)" font-family="Inter, Arial" filter="url(#bpShadow)">
    <!-- 01 Idea -->
    <g transform="translate(0 0)"><g><rect x="4" y="7" width="150" height="118" rx="19" fill="#22D3EE" opacity=".12"/><rect width="150" height="118" rx="19" fill="#071E2E" stroke="#22D3EE"/><text x="16" y="26" fill="#38BDF8" font-family="Consolas, monospace" font-size="10">01</text><text x="16" y="56" fill="#E0F2FE" font-size="18" font-weight="900">Idea</text><text x="16" y="78" fill="#7DD3FC" font-size="11">why it matters</text><circle cx="128" cy="100" r="6" fill="#38BDF8" filter="url(#bpGlow)"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4s" repeatCount="indefinite"/></g></g>
    <!-- 02 Wireframe -->
    <g transform="translate(166 0)"><g><rect x="4" y="7" width="150" height="118" rx="19" fill="#60A5FA" opacity=".1"/><rect width="150" height="118" rx="19" fill="#0E1E42" stroke="#60A5FA"/><text x="16" y="26" fill="#60A5FA" font-family="Consolas, monospace" font-size="10">02</text><text x="16" y="56" fill="#DBEAFE" font-size="18" font-weight="900">Wireframe</text><text x="16" y="78" fill="#BFDBFE" font-size="11">structure first</text><circle cx="128" cy="100" r="6" fill="#60A5FA" filter="url(#bpGlow)"/><animateTransform attributeName="transform" type="translate" values="0 -6;0 6;0 -6" dur="4.4s" repeatCount="indefinite"/></g></g>
    <!-- 03 Design -->
    <g transform="translate(332 0)"><g><rect x="4" y="7" width="150" height="118" rx="19" fill="#A78BFA" opacity=".1"/><rect width="150" height="118" rx="19" fill="#1F1440" stroke="#A78BFA"/><text x="16" y="26" fill="#A78BFA" font-family="Consolas, monospace" font-size="10">03</text><text x="16" y="56" fill="#EDE9FE" font-size="18" font-weight="900">Design</text><text x="16" y="78" fill="#DDD6FE" font-size="11">hierarchy + light</text><circle cx="128" cy="100" r="6" fill="#A78BFA" filter="url(#bpGlow)"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -6;0 6" dur="4.8s" repeatCount="indefinite"/></g></g>
    <!-- 04 Interaction -->
    <g transform="translate(498 0)"><g><rect x="4" y="7" width="150" height="118" rx="19" fill="#E879F9" opacity=".1"/><rect width="150" height="118" rx="19" fill="#33103C" stroke="#E879F9"/><text x="16" y="26" fill="#E879F9" font-family="Consolas, monospace" font-size="10">04</text><text x="16" y="56" fill="#F5D0FE" font-size="18" font-weight="900">Interaction</text><text x="16" y="78" fill="#F0ABFC" font-size="11">motion + feedback</text><circle cx="128" cy="100" r="6" fill="#E879F9" filter="url(#bpGlow)"/><animateTransform attributeName="transform" type="translate" values="0 -5;0 7;0 -5" dur="4.6s" repeatCount="indefinite"/></g></g>
    <!-- 05 Build -->
    <g transform="translate(664 0)"><g><rect x="4" y="7" width="150" height="118" rx="19" fill="#F472B6" opacity=".1"/><rect width="150" height="118" rx="19" fill="#3A0B22" stroke="#F472B6"/><text x="16" y="26" fill="#F472B6" font-family="Consolas, monospace" font-size="10">05</text><text x="16" y="56" fill="#FCE7F3" font-size="18" font-weight="900">Build</text><text x="16" y="78" fill="#FBCFE8" font-size="11">componentize</text><circle cx="128" cy="100" r="6" fill="#F472B6" filter="url(#bpGlow)"/><animateTransform attributeName="transform" type="translate" values="0 7;0 -5;0 7" dur="5s" repeatCount="indefinite"/></g></g>
    <!-- 06 Optimize -->
    <g transform="translate(830 0)"><g><rect x="4" y="7" width="150" height="118" rx="19" fill="#FBBF24" opacity=".12"/><rect width="150" height="118" rx="19" fill="#3C2808" stroke="#FBBF24"/><text x="16" y="26" fill="#FBBF24" font-family="Consolas, monospace" font-size="10">06</text><text x="16" y="56" fill="#FEF3C7" font-size="18" font-weight="900">Optimize</text><text x="16" y="78" fill="#FDE68A" font-size="11">measure + trim</text><circle cx="128" cy="100" r="6" fill="#FBBF24" filter="url(#bpGlow)"/><animateTransform attributeName="transform" type="translate" values="0 -7;0 5;0 -7" dur="5.2s" repeatCount="indefinite"/></g></g>
    <!-- 07 Deploy -->
    <g transform="translate(996 0)"><g><rect x="4" y="7" width="150" height="118" rx="19" fill="#22C55E" opacity=".12"/><rect width="150" height="118" rx="19" fill="#06301F" stroke="#22C55E"/><text x="16" y="26" fill="#4ADE80" font-family="Consolas, monospace" font-size="10">07</text><text x="16" y="56" fill="#DCFCE7" font-size="18" font-weight="900">Deploy</text><text x="16" y="78" fill="#BBF7D0" font-size="11">ship + watch</text><circle cx="128" cy="100" r="6" fill="#4ADE80" filter="url(#bpGlow)"><animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="0 5;0 -8;0 5" dur="4.5s" repeatCount="indefinite"/></g></g>
  </g>
  <g transform="translate(56 294)"><text fill="#64748B" font-family="Consolas, monospace" font-size="11">PIPELINE_STATUS</text><text x="128" fill="#F0ABFC" font-family="Consolas, monospace" font-size="11">● FLOWING END TO END</text></g>
</svg>
