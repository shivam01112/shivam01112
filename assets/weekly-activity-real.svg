<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rcTitle rcDesc">
  <title id="rcTitle">Real weekly contribution activity</title>
  <desc id="rcDesc">Bar chart of real GitHub contributions for the last 12 weeks, sourced live from the GitHub GraphQL API.</desc>
  <defs>
    <linearGradient id="rcBg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".5" stop-color="#0B3B5C"/>
      <stop offset="1" stop-color="#04342F"/>
    </linearGradient>
    <linearGradient id="barGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset=".6" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="barGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rcClip"><rect width="1280" height="320" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#rcClip)">
    <rect width="1280" height="320" fill="url(#rcBg)"/>
  </g>
  <rect x="1" y="1" width="1278" height="318" rx="27" stroke="#164E63" stroke-width="2"/>
  <text x="48" y="38" fill="#67E8F9" font-family="Consolas, monospace" font-size="14" font-weight="800" letter-spacing="2">REAL WEEKLY CONTRIBUTIONS · LIVE FROM GITHUB API</text>
  <text x="1232" y="38" fill="#A78BFA" font-family="Consolas, monospace" font-size="12" text-anchor="end">362 total (last year)</text>
  <rect x="60.0" y="268.6" width="89.2" height="1.4" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-06-13: 1 contributions</title><animate attributeName="height" from="0" to="1.4" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="268.6" dur="1s" fill="freeze" /></rect><rect x="159.2" y="270.0" width="89.2" height="0.0" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-06-20: 0 contributions</title><animate attributeName="height" from="0" to="0.0" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="270.0" dur="1s" fill="freeze" /></rect><rect x="258.3" y="270.0" width="89.2" height="0.0" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-06-27: 0 contributions</title><animate attributeName="height" from="0" to="0.0" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="270.0" dur="1s" fill="freeze" /></rect><rect x="357.5" y="267.2" width="89.2" height="2.8" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-07-04: 2 contributions</title><animate attributeName="height" from="0" to="2.8" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="267.2" dur="1s" fill="freeze" /></rect><rect x="456.7" y="270.0" width="89.2" height="0.0" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-07-11: 0 contributions</title><animate attributeName="height" from="0" to="0.0" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="270.0" dur="1s" fill="freeze" /></rect><rect x="555.8" y="263.1" width="89.2" height="6.9" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-07-18: 5 contributions</title><animate attributeName="height" from="0" to="6.9" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="263.1" dur="1s" fill="freeze" /></rect><rect x="655.0" y="260.3" width="89.2" height="9.7" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-07-25: 7 contributions</title><animate attributeName="height" from="0" to="9.7" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="260.3" dur="1s" fill="freeze" /></rect><rect x="754.2" y="257.5" width="89.2" height="12.5" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-08-01: 9 contributions</title><animate attributeName="height" from="0" to="12.5" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="257.5" dur="1s" fill="freeze" /></rect><rect x="853.3" y="256.2" width="89.2" height="13.8" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-08-08: 10 contributions</title><animate attributeName="height" from="0" to="13.8" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="256.2" dur="1s" fill="freeze" /></rect><rect x="952.5" y="214.6" width="89.2" height="55.4" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-08-15: 40 contributions</title><animate attributeName="height" from="0" to="55.4" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="214.6" dur="1s" fill="freeze" /></rect><rect x="1051.7" y="90.0" width="89.2" height="180.0" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-08-22: 130 contributions</title><animate attributeName="height" from="0" to="180.0" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="90.0" dur="1s" fill="freeze" /></rect><rect x="1150.8" y="99.7" width="89.2" height="170.3" rx="4" fill="url(#barGradient)" filter="url(#barGlow)"><title>2026-08-28: 123 contributions</title><animate attributeName="height" from="0" to="170.3" dur="1s" fill="freeze" /><animate attributeName="y" from="270.0" to="99.7" dur="1s" fill="freeze" /></rect>
